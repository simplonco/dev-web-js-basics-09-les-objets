remote_theme: simplonco/simplonline-ressources-jekyll-theme

title: "JS Basics 09 - Les objets"
description: "Créer et manipuler des objets en JavaScript"
github_org: simplonco
lang: fr

show_toc: true

readme_index:
  with_frontmatter: true

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
  auto_ids: true

defaults:
  - scope:
      path: ""
    values:
      layout: default

plugins:
  - jekyll-readme-index
  - jekyll-remote-theme
  - jekyll-stepper